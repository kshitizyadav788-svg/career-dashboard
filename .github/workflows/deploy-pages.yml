name: Deploy static site to GitHub Pages

# Replaces the deprecated "legacy" Jekyll Pages builder (which began failing 2026-08-06)
# with a direct static-file deploy via GitHub Actions. Deploys the repo as-is (it's a
# static HTML dashboard + JSON + resume files; .nojekyll keeps it unprocessed).

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one concurrent deployment; don't cancel an in-progress run (let it finish).
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
